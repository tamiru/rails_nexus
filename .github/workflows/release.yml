name: Release gem

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish rails_nexus
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://rubygems.org/gems/rails_nexus
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify tag matches gem version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(ruby -Ilib -rrails_nexus/version -e 'print RailsNexus::VERSION')"
          test "$RELEASE_TAG" = "v${version}" || {
            echo "Tag ${RELEASE_TAG} does not match gem version ${version}" >&2
            exit 1
          }

      - name: Run release tests
        run: bin/rails test

      - name: Build and validate gem
        run: |
          version="$(ruby -Ilib -rrails_nexus/version -e 'print RailsNexus::VERSION')"
          mkdir -p pkg
          gem build rails_nexus.gemspec --output "pkg/rails_nexus-${version}.gem"
          gem check "pkg/rails_nexus-${version}.gem"

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" pkg/*.gem \
              --verify-tag \
              --generate-notes
          fi
